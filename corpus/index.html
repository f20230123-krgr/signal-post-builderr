<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Signalpost Atlas</title>
<style>
:root {
  --bg: #0b171e; --panel: #12232d; --panel-2: #0f1e27; --ink: #e5eef2; --muted: #92a8b3; --line: #243a46;
  --accent: #4db3d4; --accent-soft: #123747; --accent-ink: #06222c;
  --ok: #52c58c; --ok-soft: #123626; --warn: #e3a54c; --warn-soft: #3a2a0e; --bad: #f08a80; --bad-soft: #3d1b18;
  --reg: #6fa8ec; --own: #4fc491; --ext: #e6a143; --mark: #5c4b12; --shadow: none;
  --radius: 10px;
  --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, "Liberation Mono", monospace;
  color-scheme: dark;
}
/* Dark is the default for everyone; light is an explicit choice from the Theme button. */
:root[data-theme="light"] {
  --bg: #edf1f3; --panel: #ffffff; --panel-2: #f5f8f9; --ink: #0e222d; --muted: #566a75; --line: #d3dce1;
  --accent: #0a6a89; --accent-soft: #dcecf2; --accent-ink: #ffffff;
  --ok: #176b43; --ok-soft: #dff1e7; --warn: #9a5a07; --warn-soft: #fbecd2; --bad: #a93a30; --bad-soft: #f8e0dd;
  --reg: #1d5fa8; --own: #1f8a5b; --ext: #c47a12; --mark: #fff0b8; --shadow: 0 1px 2px rgba(14,34,45,.06), 0 6px 18px rgba(14,34,45,.06);
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--sans); -webkit-text-size-adjust: 100%; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent); }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.skip { position: absolute; left: -999px; top: 8px; background: var(--accent); color: var(--accent-ink); padding: 8px 12px; border-radius: 6px; z-index: 50; }
.skip:focus { left: 8px; }
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--mono); font-size: .86em; }

/* top bar */
.top { display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 20; }
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.brand h1 { margin: 0; font-size: 1.05rem; letter-spacing: .01em; white-space: nowrap; }
.brand h1 b { color: var(--accent); }
.brand .asof { color: var(--muted); font-size: .82rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top .sp { flex: 1; }
.sitelinks { display: contents; }
.sitelinks a { text-decoration: none; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 6px 12px; line-height: 1.3; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:disabled { opacity: .45; cursor: not-allowed; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--accent); white-space: nowrap; }

/* layout */
.app { display: grid; grid-template-columns: minmax(320px, 400px) minmax(0, 1fr); height: calc(100vh - 57px); height: calc(100dvh - 57px); }
.list-pane { display: flex; flex-direction: column; border-right: 1px solid var(--line); background: var(--panel-2); min-height: 0; }
.tools { padding: 12px; display: grid; gap: 10px; border-bottom: 1px solid var(--line); background: var(--panel); }
.search { position: relative; }
.search input { width: 100%; padding: 9px 12px 9px 34px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
.search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); }
.search kbd { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); font: .72rem var(--mono); color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 3px 11px; font-size: .84rem; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.row-tools { display: flex; align-items: center; gap: 8px; font-size: .85rem; color: var(--muted); }
.row-tools select { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 3px 6px; }
.row-tools .sp { flex: 1; }
.list { list-style: none; margin: 0; padding: 0; overflow-y: auto; flex: 1; min-height: 0; }
.row { display: flex; align-items: stretch; border-bottom: 1px solid var(--line); background: var(--panel-2); }
.row.sel { background: var(--accent-soft); }
.pick { align-self: center; margin: 0 0 0 12px; width: 18px; height: 18px; accent-color: var(--accent); flex: none; }
.item { flex: 1; text-align: left; background: transparent; border: 0; padding: 10px 12px; display: grid; gap: 2px; min-width: 0; }
.item .nm { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .sub { color: var(--muted); font-size: .82rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dots { display: flex; gap: 3px; margin-top: 3px; }
.dots i { width: 14px; height: 5px; border-radius: 3px; background: var(--line); }
.dots i.on { background: var(--accent); }
.more { padding: 12px; text-align: center; }
.empty { padding: 24px 16px; color: var(--muted); text-align: center; }

main { overflow-y: auto; min-height: 0; padding: 20px clamp(14px, 3vw, 36px) 60px; }
.wrap { max-width: 980px; margin: 0 auto; display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
.wrap > * { min-width: 0; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; box-shadow: var(--shadow); }
.card h2 { margin: 0 0 10px; font-size: .78rem; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); font-weight: 650; }
.head { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: flex-start; }
.head .ttl { flex: 1; min-width: 240px; }
.head h2.co { margin: 0; font-size: clamp(1.25rem, 3vw, 1.7rem); text-transform: none; letter-spacing: 0; color: var(--ink); line-height: 1.2; }
.head .meta { color: var(--muted); margin-top: 4px; display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: .88rem; }
.head .headline { margin: 8px 0 0; color: var(--ink); font-size: .95rem; }
.item .sub.hl { font-variant-numeric: tabular-nums; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.pill { display: inline-block; border-radius: 999px; padding: 1px 9px; font-size: .76rem; font-weight: 600; background: var(--panel-2); border: 1px solid var(--line); color: var(--muted); }
.pill.available, .pill.active { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.pill.ambiguous, .pill.not_applicable { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.pill.failed, .pill.blocked, .pill.bankrupt { background: var(--bad-soft); color: var(--bad); border-color: transparent; }

.story { display: grid; gap: 2px; max-width: 78ch; }
.story .sent { display: grid; grid-template-columns: 78px 1fr; gap: 12px; padding: 7px 0; border-bottom: 1px solid var(--line); line-height: 1.55; }
.story .sent:last-child { border-bottom: 0; }
.story .topic { color: var(--muted); font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; padding-top: 3px; font-weight: 650; }
.cite { font: .7rem var(--mono); border: 1px solid var(--line); background: var(--panel-2); color: var(--accent); border-radius: 5px; padding: 0 4px; margin-left: 2px; vertical-align: super; line-height: 1.2; }
.cite:hover { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.gaps { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; align-items: center; color: var(--muted); font-size: .88rem; }
.gaps .pill { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.changes { margin-top: 10px; font-size: .9rem; color: var(--muted); }

.facts h3 { margin: 18px 0 4px; font-size: .95rem; }
.facts h3:first-of-type { margin-top: 0; }
.fact { display: grid; grid-template-columns: 150px 1fr auto; gap: 4px 14px; padding: 8px 0 8px 12px; border-bottom: 1px solid var(--line); border-left: 3px solid var(--line); margin-left: 0; align-items: baseline; }
.fact.src-official_registry { border-left-color: var(--reg); }
.fact.src-company_owned { border-left-color: var(--own); }
.fact.src-external { border-left-color: var(--ext); }
.fact .k { color: var(--muted); font-size: .86rem; }
.fact .v { overflow-wrap: anywhere; }
.fact.na .v { color: var(--muted); font-style: italic; }
.fact .why { border: 1px solid var(--line); background: transparent; border-radius: 6px; font-size: .78rem; padding: 2px 8px; color: var(--accent); }
.fact .why:hover { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.fact .sub { color: var(--muted); font-size: .82rem; }
.fact.cont { border-top-color: transparent; }
.fact.cont .k { visibility: hidden; }
.fin { width: 100%; border-collapse: collapse; font-size: .9rem; margin: 6px 0 12px; font-variant-numeric: tabular-nums; }
.fin th, .fin td { padding: 7px 12px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
.fin th:first-child, .fin td:first-child { text-align: left; color: var(--muted); font-weight: 500; }
.fin thead th { color: var(--muted); font-weight: 650; font-size: .78rem; letter-spacing: .06em; text-transform: uppercase; }
.fin tbody tr { border-left: 3px solid var(--reg); }
.cellbtn { background: none; border: 0; padding: 0; color: var(--ink); font: inherit; cursor: pointer; text-decoration: underline dotted var(--muted); text-underline-offset: 4px; }
.cellbtn:hover { color: var(--accent); }
.chg.up { color: var(--ok); }
.chg.down { color: var(--bad); }
.dash { color: var(--muted); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: .82rem; color: var(--muted); margin-bottom: 8px; }
.legend span::before { content: ""; display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -2px; background: var(--c); }

.cov { display: grid; gap: 9px; }
.cov .r { display: grid; grid-template-columns: 170px 1fr 60px; gap: 10px; align-items: center; font-size: .9rem; }
.bar { height: 10px; border-radius: 6px; background: var(--line); overflow: hidden; }
.bar b { display: block; height: 100%; background: var(--accent); }
.bar.low b { background: var(--ext); }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.kpi .n { font-size: 1.6rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.kpi .l { color: var(--muted); font-size: .82rem; }
.steps { margin: 0; padding-left: 20px; display: grid; gap: 6px; }

/* compare */
.cmp { width: 100%; border-collapse: collapse; font-size: .9rem; min-width: 560px; }
.cmp th, .cmp td { text-align: left; vertical-align: top; padding: 8px 10px; border-bottom: 1px solid var(--line); }
.cmp thead th { position: sticky; top: 0; background: var(--panel); z-index: 1; }
.cmp tbody th { color: var(--muted); font-weight: 500; width: 140px; }
.cmp td.diff { background: var(--mark); }
.cmp td.na { color: var(--muted); font-style: italic; }
.scroll-x { overflow-x: auto; }
.tray { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); background: var(--ink); color: var(--bg); border-radius: 999px; padding: 8px 10px 8px 18px; display: none; gap: 12px; align-items: center; box-shadow: 0 8px 28px rgba(0,0,0,.3); z-index: 30; max-width: calc(100vw - 24px); }
.tray.on { display: flex; }
/* The tray is dark on a light page and light on a dark one (it uses --ink as its ground), so its buttons take the page colour for text. */
.tray .btn { border-color: color-mix(in srgb, var(--bg) 40%, transparent); background: transparent; color: var(--bg); }
.tray .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tray .btn.primary:disabled { opacity: .55; }

/* drawer */
dialog { border: 0; padding: 0; background: transparent; color: var(--ink); max-width: none; max-height: none; }
dialog::backdrop { background: rgba(7,18,24,.5); }
.drawer { position: fixed; right: 0; top: 0; bottom: 0; width: min(520px, 100vw); margin: 0; background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto; padding: 18px 20px 40px; box-shadow: -10px 0 40px rgba(0,0,0,.25); }
.drawer h3 { margin: 0 0 4px; font-size: 1.05rem; }
.drawer .close { float: right; }
.ev { border: 1px solid var(--line); border-radius: 8px; padding: 12px; margin-top: 12px; background: var(--panel-2); display: grid; gap: 8px; }
.ev dl { margin: 0; display: grid; grid-template-columns: 112px 1fr; gap: 4px 10px; font-size: .86rem; }
.ev dt { color: var(--muted); }
.ev dd { margin: 0; overflow-wrap: anywhere; }
.ev blockquote { margin: 0; padding: 8px 10px; border-left: 3px solid var(--accent); background: var(--mark); font: .85rem var(--mono); overflow-wrap: anywhere; white-space: pre-wrap; border-radius: 0 6px 6px 0; }
.guide { max-width: 640px; margin: 8vh auto; background: var(--panel); border-radius: 14px; padding: 22px 26px; border: 1px solid var(--line); }
.guide h3 { margin-top: 0; }
.guide dl { display: grid; grid-template-columns: 130px 1fr; gap: 6px 12px; }
.guide dt { font-weight: 600; }
.guide dd { margin: 0; }

.only-mobile { display: none; }
@media (max-width: 900px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  body[data-view="detail"] .list-pane, body[data-view="compare"] .list-pane, body[data-view="overview"] .list-pane { display: none; }
  body[data-view="list"] main, body[data-view="home"] main { display: none; }
  body[data-view="home"] .list-pane, body[data-view="list"] .list-pane { display: flex; }
  .only-mobile { display: inline-flex; }
  .fact { grid-template-columns: 1fr auto; }
  .fact .k { grid-column: 1 / -1; }
  .cov .r { grid-template-columns: 1fr 60px; }
  .cov .r .bar { grid-column: 1 / -1; order: 3; }
  .brand .asof { display: none; }
  .sitelinks { display: none; }
  .tray { bottom: 10px; }
}
@media (max-width: 560px) {
  .top { gap: 4px; padding: 8px 10px; }
  .top .sp { flex: 1 1 0; min-width: 0; }
  .brand h1 { font-size: .92rem; }
  .top .btn { padding: 5px 8px; font-size: .86rem; }
  .story .sent { grid-template-columns: 1fr; gap: 2px; }
  .story .topic { padding-top: 0; }
}
@media (prefers-reduced-motion: no-preference) { .card, .row { transition: background .15s; } }
@media print { .top, .list-pane, .tray, .actions, .why { display: none !important; } .app { display: block; height: auto; } main { overflow: visible; } }
</style>

  else if (claim.effective_at) extra += '<div class="sub">Effective ' + esc(claim.effective_at) + "</div>";
  return '<div class="fact src-' + esc(cls) + (first === false ? " cont" : "") + '"><div class="k">' + esc(LABEL[f]) + '</div><div class="v">' + valueHtml(val) + extra + "</div>" +
    '<button type="button" class="why" data-ci="' + claim.i + '">Evidence</button></div>';
}
const SEVERITY = ["failed", "blocked", "ambiguous", "not_applicable", "not_available"];
// Every field of a section that has nothing becomes ONE line, not one row each.
function naLine(c, fields, labelOverride) {
  const states = fields.map(f => (c.all(f)[0] || {}).availability || "not_available");
  const st = SEVERITY.find(s => states.includes(s)) || "not_available";
  const names = labelOverride || fields.map(f => LABEL[f]).join(", ");
  return '<div class="fact na"><div class="k">Not found</div><div class="v">' + esc(names) + ' <span class="pill ' + esc(st) + '" title="' + esc(STATE_HELP[st] || "") + '">' + esc(st.replace("_", " ")) + "</span></div><span></span></div>";
}
const FIN_FIELDS = ["revenue", "operating_result", "profit_before_tax", "annual_result", "total_assets", "total_equity", "total_debt"];
const amountOf = v => { const m = /^(-?[\d,]+)\s*([A-Z]{3})?$/.exec(v || ""); return m ? [Number(m[1].replace(/,/g, "")), m[2] || ""] : null; };
// The filed figures as a small table, one column per filed year, with the change between the two newest.
function financialTable(c) {
  const periods = [...new Set(FIN_FIELDS.flatMap(f => c.ok(f).map(x => x.reporting_period)).filter(Boolean))].sort().reverse();
  if (!periods.length) return "";
  const claimOf = (f, p) => c.ok(f).find(x => x.reporting_period === p);
  const change = f => {
    if (periods.length < 2) return "";
    const a = claimOf(f, periods[0]), b = claimOf(f, periods[1]);
    const x = a && amountOf(a.value), y = b && amountOf(b.value);
    if (!x || !y || x[1] !== y[1] || y[0] === 0) return "";
    const pct = (x[0] - y[0]) / Math.abs(y[0]) * 100;
    return '<span class="chg ' + (pct > 0 ? "up" : pct < 0 ? "down" : "") + '">' + (pct > 0 ? "&#9650; " : pct < 0 ? "&#9660; " : "") + Math.abs(pct).toFixed(1) + "%</span>";
  };
  const cell = (f, p) => { const x = claimOf(f, p); return x ? '<button type="button" class="why cellbtn" data-ci="' + x.i + '" title="Open the evidence for this figure">' + esc(x.value) + "</button>" : '<span class="dash">&ndash;</span>'; };
  const rows = FIN_FIELDS.filter(f => c.ok(f).length).map(f =>
    "<tr><th scope=\"row\">" + esc(LABEL[f]) + "</th>" + periods.map(p => "<td>" + cell(f, p) + "</td>").join("") + "<td>" + change(f) + "</td></tr>").join("");
  const pdfs = c.ok("annual_report_pdf");
  const pdfRow = pdfs.length ? "<tr><th scope=\"row\">Filed accounts</th>" + periods.map(p => { const x = pdfs.find(y => y.reporting_period === p); return "<td>" + (x ? '<a href="' + esc(x.value) + '" target="_blank" rel="noopener noreferrer">PDF</a>' : '<span class="dash">&ndash;</span>') + "</td>"; }).join("") + "<td></td></tr>" : "";
  return '<div class="scroll-x"><table class="fin"><thead><tr><th></th>' + periods.map(p => "<th scope=\"col\">" + esc(p) + "</th>").join("") +
    "<th scope=\"col\">Change</th></tr></thead><tbody>" + rows + pdfRow + "</tbody></table></div>";
}
function section(c, title, fields) {
  let html = "<h3>" + esc(title) + "</h3>", missing = [], found = 0;
  if (title === "Annual accounts") {
    const table = financialTable(c);
    // The combined latest/earlier strings only matter when there are no discrete figures.
    fields = fields.filter(f => !FIN_FIELDS.includes(f) && f !== "annual_report_pdf" && !(table && /^annual_accounts_/.test(f)));
    if (table) { html += table; found++; }
  }
  fields.forEach(f => {
    let list = c.ok(f);
    if (f === "dated_activity") list = list.slice().sort((a, b) => latestDate(b.value).localeCompare(latestDate(a.value)));
    if (!list.length) { missing.push(f); return; }
    found++;
    html += list.slice(0, 8).map((x, i) => factRow(c, f, x, i === 0)).join("");
    if (list.length > 8) html += "<details><summary>Show " + (list.length - 8) + " more</summary>" + list.slice(8).map(x => factRow(c, f, x, false)).join("") + "</details>";
  });
  if (missing.length) html += naLine(c, missing, title === "Annual accounts" && !found ? "Financial figures" : null);
  return html;
}
const TOPIC = {
  legal_name: "Company", business_description: "Activity", annual_accounts_latest: "Accounts", revenue: "Accounts", leader: "People", workplace: "Places",
  official_website: "Online", hiring_signal: "Hiring", dated_activity: "Latest"
};
function topicOf(x, i, n) {
  const hit = (x.fields || []).find(f => TOPIC[f]);
  if (hit) return TOPIC[hit];
  return /^First run|^No material|^Since the previous run/.test(x.text) ? "Changes" : "Gaps";
}
// The headline minus the registry status, which the header already shows as a pill.
function headlineFacts(c) {
  const rest = c.status && c.headline.toLowerCase().indexOf(c.status.toLowerCase()) === 0 ? c.headline.slice(c.status.length).replace(/^,\s*/, "") : c.headline;
  return rest ? rest.charAt(0).toUpperCase() + rest.slice(1) : "";
}
function renderCompany(c) {
  const s = c.env.summary || { sentences: [], unknowns: [], changes: [] };
  const story = (s.sentences || []).map((x, i, a) =>
    '<div class="sent"><span class="topic">' + esc(topicOf(x, i, a.length)) + "</span><span>" + esc(x.text.replace(/^As of \d{4}-\d{2}-\d{2}: /, "")) + citeButtons(c, x.evidence_ids) + "</span></div>").join("");
  const gaps = (s.unknowns || []).length ? '<div class="gaps">Not found:' + s.unknowns.map(u => '<span class="pill">' + esc(u) + "</span>").join("") + "</div>" : "";
  const st = (c.status || "").toLowerCase();
  $("#main").innerHTML = '<div class="wrap">' +
    '<div class="card"><div class="head"><div class="ttl">' +
    '<button class="btn only-mobile" id="backBtn" type="button">&larr; Companies</button>' +
    '<h2 class="co">' + esc(c.name) + "</h2><div class=\"meta\"><span class=\"mono\">org. " + esc(c.org) + "</span>" +
    (c.form ? "<span>" + esc(c.form) + "</span>" : "") + (c.status ? '<span class="pill ' + esc(st) + '">' + esc(c.status) + "</span>" : "") +
    (c.site ? '<a href="' + esc(c.site) + '" target="_blank" rel="noopener noreferrer">' + esc(host(c.site)) + "</a>" : "") + "</div>" +
    (headlineFacts(c) ? '<p class="headline">' + esc(headlineFacts(c)) + "</p>" : "") + "</div>" +
    '<div class="actions"><button class="btn" id="pickBtn" type="button">' + (state.picked.includes(c.org) ? "Remove from compare" : "Add to compare") + "</button>" +
    '<button class="btn" id="jsonBtn" type="button">Envelope JSON</button><button class="btn" id="linkBtn" type="button">Copy link</button></div></div></div>' +
    '<div class="card"><h2>Summary as of ' + esc(s.as_of || DATA.as_of) + '</h2><div class="story">' + story + "</div>" + gaps +
    ((s.changes || []).length ? '<div class="changes">Changes since the last run: ' + esc(s.changes.join("; ")) + "</div>" : "") + "</div>" +
    '<div class="card facts"><h2>Every fact, with its source</h2><div class="legend">' +
    '<span style="--c:var(--reg)">Official registry</span><span style="--c:var(--own)">Company-owned</span><span style="--c:var(--ext)">External</span></div>' +
    SECTIONS.map(sec => section(c, sec[0], sec[1])).join("") + "</div></div>";
  $("#main").scrollTop = 0;
}

/* ---------- compare ---------- */
function renderCompare() {
  const cs = state.picked.map(o => byOrg[o]).filter(Boolean);
  const rowsDef = [
    ["Registry status", c => c.status], ["Legal form", c => c.form], ["Industry", c => c.industry], ["Founded", c => c.founded],
    ["Employees", c => c.employees != null ? fmt(c.employees) : null],
    ["Revenue", c => c.revenue != null ? money(c.revenue) + " " + c.currency : null], ["Net result", c => c.result != null ? money(c.result) + " " + c.currency : null],
    ["Accounts period", c => (c.ok("annual_accounts_latest")[0] || {}).reporting_period],
    ["Leadership", c => c.ok("leader").slice(0, 3).map(x => x.value).join("; ")],
    ["Workplaces", c => c.ok("workplace").length ? String(c.ok("workplace").length) : null],
    ["Website", c => c.site && host(c.site)], ["Social profiles", c => c.ok("company_profile").length ? c.ok("company_profile").map(x => host(x.value)).join(", ") : null],
    ["Hiring", c => c.ok("hiring_signal").length ? c.ok("hiring_signal")[0].value : null],
    ["Latest company news", c => { const a = c.siteNews.map(x => x.effective_at || latestDate(x.value)).filter(Boolean).sort().pop(); return a || null; }],
    ["Information types found", c => c.score + " of " + FLAGS.length], ["Evidence records", c => String(Object.keys(c.ev).length)]
  ];
  const head = "<thead><tr><th></th>" + cs.map(c => '<th scope="col"><button class="btn ghost" data-o="' + c.org + '" type="button">' + esc(c.name) + '</button><div class="mono">' + esc(c.org) + "</div></th>").join("") + "</tr></thead>";
  const body = "<tbody>" + rowsDef.map(r => {
    const vals = cs.map(c => r[1](c));
    const distinct = new Set(vals.map(v => v == null || v === "" ? "" : String(v)));
    const differs = distinct.size > 1;
    return "<tr><th scope=\"row\">" + esc(r[0]) + "</th>" + vals.map(v => (v == null || v === "") ? '<td class="na">Not found</td>' : '<td class="' + (differs ? "diff" : "") + '">' + esc(v) + "</td>").join("") + "</tr>";
  }).join("") + "</tbody>";
  $("#main").innerHTML = '<div class="wrap"><div class="card"><div class="head"><div class="ttl"><button class="btn only-mobile" id="backBtn" type="button">&larr; Companies</button>' +
    '<h2 class="co">Comparing ' + cs.length + ' companies</h2><div class="meta">Highlighted cells differ between companies. Select a company name to open its evidence.</div></div>' +
    '<div class="actions"><button class="btn" id="cmpCsv" type="button">Download CSV</button></div></div></div>' +
    '<div class="card scroll-x"><table class="cmp">' + head + body + "</table></div></div>";
  $("#cmpCsv").onclick = () => {
    const q = v => '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"';
    download("signalpost-compare.csv", ["Field"].concat(cs.map(c => c.name)).map(q).join(",") + "\n" + rowsDef.map(r => [r[0]].concat(cs.map(c => r[1](c))).map(q).join(",")).join("\n"), "text/csv");
  };
  $("#main").scrollTop = 0;
}

/* ---------- evidence drawer ---------- */
function evidenceHtml(e) {
  const src = isUrl(e.source_url) ? '<a href="' + esc(e.source_url) + '" target="_blank" rel="noopener noreferrer">' + esc(e.source_url) + "</a>" :
    esc(e.source_url) + " (Builderr's frozen registry snapshot, shipped with the run)";
  return '<div class="ev"><dl><dt>Source</dt><dd>' + src + "</dd><dt>Source type</dt><dd>" + esc(CLASS_LABEL[e.source_class] || e.source_class || "") + "</dd>" +
    "<dt>Retrieved</dt><dd>" + esc(e.retrieved_at || "unknown") + "</dd>" +
    (e.reporting_period ? "<dt>Reporting period</dt><dd>" + esc(e.reporting_period) + "</dd>" : "") +
    (e.effective_at ? "<dt>Effective</dt><dd>" + esc(e.effective_at) + "</dd>" : "") +
    (e.linked_from ? "<dt>Reached via</dt><dd>" + valueHtml(e.linked_from) + "</dd>" : "") +
    '<dt>Content SHA-256</dt><dd class="mono">' + esc(e.content_sha256 || "n/a") + "</dd></dl>" +
    (e.claim_span ? "<div><div class=\"sub\">Supporting text</div><blockquote>" + esc(e.claim_span) + "</blockquote></div>" : "") + "</div>";
}
function openDrawer(html) {
  const d = $("#drawer");
  $("#drawerBody").innerHTML = '<button class="btn close" type="button" id="drawerClose">Close</button>' + html;
  if (!d.open) d.showModal();
  $("#drawerClose").focus();
}
function openClaim(c, ci) {
  const claim = c.claims[ci], st = claim.availability || "available";
  const evs = (claim.evidence_ids || []).map(i => c.ev[i]).filter(Boolean);
  openDrawer("<h3>" + esc(LABEL[claim.field] || claim.field) + '</h3><p>' + valueHtml(claim.value || "Not found") + '</p><p><span class="pill ' + esc(st) + '">' + esc(st.replace("_", " ")) + "</span> " +
    (claim.confidence != null ? '<span class="sub">identity confidence ' + Math.round(claim.confidence * 100) + "%</span>" : "") + '</p><p class="sub">' + esc(STATE_HELP[st] || "") + "</p>" +
    (evs.length ? evs.map(evidenceHtml).join("") : '<p class="sub">No source recorded: nothing is published without one.</p>'));
}
function openEv(c, id) {
  const e = c.ev[id]; if (!e) return;
  const used = c.claims.filter(x => (x.evidence_ids || []).includes(id)).slice(0, 6);
  openDrawer("<h3>Evidence " + esc(id.replace("ev-", "")) + "</h3>" + evidenceHtml(e) +
    (used.length ? '<p class="sub">Supports: ' + used.map(x => esc(LABEL[x.field] || x.field)).filter((v, i, a) => a.indexOf(v) === i).join(", ") + "</p>" : ""));
}

/* ---------- guide ---------- */
function openGuide() {
  $("#guideBody").innerHTML = "<h3>How to read this page</h3><p>Every sentence and fact comes from a recorded source. Nothing is estimated, and a missing value is shown as <i>not found</i>, never as zero.</p>" +
    '<dl><dt>Left bar colour</dt><dd><span style="color:var(--reg)">Blue</span> official registry, <span style="color:var(--own)">green</span> the company\'s own site, <span style="color:var(--ext)">amber</span> external source.</dd>' +
    "<dt>Numbered citations</dt><dd>Open the evidence behind a sentence: link, retrieval time, content hash and quoted text.</dd>" +
    Object.keys(STATE_HELP).map(k => "<dt>" + esc(k.replace("_", " ")) + "</dt><dd>" + esc(STATE_HELP[k]) + "</dd>").join("") +
    '</dl><p><b>Shortcuts:</b> <span class="mono">/</span> search, <span class="mono">Esc</span> close.</p><button class="btn primary" type="button" id="guideClose">Got it</button>';
  $("#guide").showModal(); $("#guideClose").focus();
}

/* ---------- routing ---------- */
function route() {
  const h = decodeURIComponent(location.hash.replace(/^#/, ""));
  const m = /^c=(\d{9})$/.exec(h), cm = /^cmp=([\d,]+)$/.exec(h);
  if (m && byOrg[m[1]]) {
    state.open = m[1]; setView("detail"); renderCompany(byOrg[m[1]]);
  } else if (cm) {
    state.picked = cm[1].split(",").filter(o => byOrg[o]).slice(0, 4); state.open = null;
    if (state.picked.length) { setView("compare"); renderCompare(); } else { setView("home"); renderHome(); }
    renderTray();
  } else {
    state.open = null; setView(h === "overview" ? (window.innerWidth <= 900 ? "overview" : "home") : window.innerWidth <= 900 ? "list" : "home"); renderHome();
  }
  renderList();
}
function go(hash) { if (location.hash === hash) route(); else location.hash = hash; }

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const t = e.target.closest("button, a, input");
  if (!t) return;
  if (t.classList.contains("item")) { go("#c=" + t.dataset.o); }
  else if (t.id === "moreBtn") { state.limit += 60; renderList(); }
  else if (t.dataset.f) { state.filters.has(t.dataset.f) ? state.filters.delete(t.dataset.f) : state.filters.add(t.dataset.f); state.limit = 60; renderTools(); renderList(); }
  else if (t.dataset.ci != null && t.classList.contains("why")) { openClaim(byOrg[state.open], Number(t.dataset.ci)); }
  else if (t.classList.contains("cite")) { openEv(byOrg[state.open], t.dataset.ev); }
  else if (t.id === "drawerClose") { $("#drawer").close(); }
  else if (t.id === "guideBtn") { openGuide(); }
  else if (t.id === "overviewBtn") { go("#overview"); }
  else if (t.id === "guideClose") { $("#guide").close(); }
  else if (t.id === "backBtn") { go("#"); }
  else if (t.id === "pickBtn") { const top = $("#main").scrollTop; togglePick(state.open); renderCompany(byOrg[state.open]); $("#main").scrollTop = top; renderList(); $("#pickBtn").focus(); }
  else if (t.id === "jsonBtn") { download(state.open + ".envelope.json", JSON.stringify(byOrg[state.open].env, null, 2), "application/json"); }
  else if (t.id === "linkBtn") { try { navigator.clipboard.writeText(location.href); t.textContent = "Link copied"; } catch (x) { t.textContent = "Copy from the address bar"; } }
  else if (t.id === "cmpGo") { go("#cmp=" + state.picked.join(",")); }
  else if (t.id === "cmpClear") { state.picked = []; renderTray(); renderList(); if (state.view === "compare") go("#"); }
  else if (t.id === "csv") { exportCsv(); }
  else if (t.id === "themeBtn") { cycleTheme(); }
  else if (t.dataset.o && t.closest(".cmp")) { go("#c=" + t.dataset.o); }
});
document.addEventListener("change", e => {
  if (e.target.classList.contains("pick")) { if (togglePick(e.target.dataset.o, e.target.checked) === false) e.target.checked = false; }
  else if (e.target.id === "sort") { state.sort = e.target.value; renderList(); }
});
let timer; $("#q").addEventListener("input", e => { clearTimeout(timer); timer = setTimeout(() => { state.q = e.target.value; state.limit = 60; renderList(); }, 80); });
document.addEventListener("keydown", e => {
  if (e.key === "/" && !/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) { e.preventDefault(); $("#q").focus(); }
});
$("#drawer").addEventListener("click", e => { if (e.target.id === "drawer") $("#drawer").close(); });
$("#guide").addEventListener("click", e => { if (e.target.id === "guide") $("#guide").close(); });
window.addEventListener("hashchange", route);

function togglePick(org, force) {
  const has = state.picked.includes(org), want = force == null ? !has : force;
  if (want && !has) {
    if (state.picked.length >= 4) { $("#trayText").textContent = "Compare up to four companies at a time"; return false; }
    state.picked.push(org);
  }
  if (!want && has) state.picked = state.picked.filter(o => o !== org);
  renderTray();
  return true;
}
function exportCsv() {
  const q = v => '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"';
  const head = ["org_number", "name", "status", "industry", "employees", "revenue", "net_result", "currency", "website"].concat(FLAGS.map(f => f[0])).concat(["found_of_" + FLAGS.length]);
  const rows = filtered().map(c => [c.org, c.name, c.status, c.industry, c.employees, c.revenue, c.result, c.revenue != null || c.result != null ? c.currency : "", c.site].concat(FLAGS.map(f => c.flags[f[0]] ? 1 : 0)).concat([c.score]));
  download("signalpost-companies.csv", [head].concat(rows).map(r => r.map(q).join(",")).join("\n"), "text/csv");
}
// Dark by default; the button switches to light and back, and the choice is remembered.
function setTheme(theme) {
  document.documentElement.dataset.theme = theme;
  $("#themeBtn").setAttribute("aria-label", "Switch to " + (theme === "dark" ? "light" : "dark") + " theme");
  $("#themeBtn").title = "Switch to " + (theme === "dark" ? "light" : "dark") + " theme";
  try { localStorage.setItem("atlas-theme", theme); } catch (e) { /* storage may be blocked */ }
}
function cycleTheme() { setTheme(document.documentElement.dataset.theme === "light" ? "dark" : "light"); }
try { if (localStorage.getItem("atlas-theme") === "light") setTheme("light"); } catch (e) { /* ignore */ }

$("#asof").textContent = (DATA.title ? DATA.title + " · " : "") + "Data as of " + DATA.as_of + " · " + fmt(companies.length) + " companies";
$("#siteLinks").innerHTML = (DATA.links || []).map(l => '<a class="btn ghost" href="' + esc(l.href) + '">' + esc(l.label) + "</a>").join("");
renderTools(); renderTray(); route();
$("#main").dataset.ready = "1";
})();
</script>
</body>
